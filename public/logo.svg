  <g fill="#FFFFFF">
    <!-- H -->
    <rect x="100" y="156" width="48" height="200"/>
    <rect x="212" y="156" width="48" height="200"/>
    <rect x="100" y="232" width="160" height="48"/>
    <!-- + -->
    <rect x="340" y="196" width="48" height="120"/>
    <rect x="316" y="232" width="96" height="48"/>
  </g>
</svg>
